openapi: 3.1.0
info:
  title: AIDepQuiz API
  version: 1.0.0
  description: |
    REST API for the AIDepQuiz questionnaire and result calculation.
    The quiz always uses exactly 10 questions in display order.
servers:
  - url: /
    description: Current application server
tags:
  - name: Quiz
    description: Read the quiz and submit answers
paths:
  /api/v1/questions:
    get:
      tags: [Quiz]
      operationId: getQuizQuestions
      summary: Get the 10 quiz questions
      description: |
        Returns exactly 10 questions with their options, ordered by
        displayOrder from 1 through 10. Option scores are not exposed to the
        client because scoring is performed by the server.
      responses:
        '200':
          description: The complete quiz question set.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuestionsResponse'
        '500':
          description: The database does not contain exactly 10 valid questions or the question configuration is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: QUIZ_CONFIGURATION_INVALID
                message: The quiz must contain exactly 10 questions.
                details: []

  /api/v1/quiz/submit:
    post:
      tags: [Quiz]
      operationId: submitQuizAnswers
      summary: Submit answers and calculate the quiz result
      description: |
        Validates one answer for each of the 10 questions, calculates the
        total score from the stored option scores, and returns the matching
        result range. The operation does not persist the answers or result, so
        the same submission may be retried.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitQuizRequest'
            example:
              answers:
                - questionId: 1
                  optionId: 3
                - questionId: 2
                  optionId: 1
                - questionId: 3
                  optionId: 2
                - questionId: 4
                  optionId: 4
                - questionId: 5
                  optionId: 1
                - questionId: 6
                  optionId: 2
                - questionId: 7
                  optionId: 3
                - questionId: 8
                  optionId: 1
                - questionId: 9
                  optionId: 2
                - questionId: 10
                  optionId: 4
      responses:
        '200':
          description: The calculated quiz result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuizResultResponse'
              example:
                sumTotal: 32
                dependencyLevel: Mức độ phụ thuộc trung bình
                comment:
                  title: 'Nhận xét về bạn:'
                  items:
                    - Nhận xét, phản hồi mang tính đánh giá về kết quả.
                    - Đây là nhận xét về kết quả bài kiểm tra.
                advice:
                  title: 'Lời khuyên hiện tại phù hợp nhất:'
                  items:
                    - Hãy xem xét kết quả và các đề xuất phù hợp.
                    - Bạn có thể thực hiện các bước cải thiện được đề xuất.
        '400':
          description: The request body is missing or cannot be parsed as JSON.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: The answers are incomplete, duplicated, unknown, or inconsistent with their questions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                wrongAnswerCount:
                  value:
                    code: INVALID_ANSWERS
                    message: Exactly 10 answers are required.
                    details: []
                invalidOption:
                  value:
                    code: INVALID_ANSWERS
                    message: Each option must belong to its question.
                    details: []
        '500':
          description: The quiz or result-range configuration is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: QUIZ_CONFIGURATION_INVALID
                message: Exactly one result must match the calculated score.
                details: []

components:
  schemas:
    Question:
      type: object
      description: A quiz question returned in its fixed display order.
      required: [id, content, displayOrder, options]
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
          description: Unique question identifier.
        content:
          type: string
          description: Question text.
        displayOrder:
          type: integer
          minimum: 1
          maximum: 10
          description: Fixed position of the question in the quiz.
        options:
          type: array
          description: Choices belonging to this question.
          items:
            $ref: '#/components/schemas/Option'

    Option:
      type: object
      description: A selectable option for a question.
      required: [id, content, displayOrder]
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
          description: Unique option identifier.
        content:
          type: string
          description: Option text.
        displayOrder:
          type: integer
          minimum: 1
          description: Fixed position of the option within its question.

    QuestionsResponse:
      type: array
      description: Exactly 10 questions ordered by displayOrder.
      minItems: 10
      maxItems: 10
      items:
        $ref: '#/components/schemas/Question'

    SubmitQuizRequest:
      type: object
      description: Answers for every question in the quiz.
      required: [answers]
      additionalProperties: false
      properties:
        answers:
          type: array
          minItems: 10
          maxItems: 10
          uniqueItems: true
          description: Exactly one questionId and optionId pair for each of the 10 questions.
          items:
            $ref: '#/components/schemas/QuizAnswer'

    QuizAnswer:
      type: object
      required: [questionId, optionId]
      additionalProperties: false
      properties:
        questionId:
          type: integer
          format: int64
          minimum: 1
          description: Identifier of the answered question.
        optionId:
          type: integer
          format: int64
          minimum: 1
          description: Identifier of the selected option. It must belong to questionId.

    QuizResultResponse:
      type: object
      description: Calculated result for the submitted answers.
      required: [sumTotal, dependencyLevel, comment, advice]
      properties:
        sumTotal:
          type: integer
          description: Total score calculated by the server.
        dependencyLevel:
          type: string
          maxLength: 150
          description: Dependency level from the matching result range.
        comment:
          $ref: '#/components/schemas/ResultContent'
        advice:
          $ref: '#/components/schemas/ResultContent'

    ResultContent:
      type: object
      description: Structured content rendered as a title and bullet list.
      required: [title, items]
      additionalProperties: false
      properties:
        title:
          type: string
          description: Heading shown above the content items.
        items:
          type: array
          minItems: 1
          description: Ordered content items rendered as bullet points.
          items:
            type: string

    ErrorDetail:
      type: object
      additionalProperties: true
      description: Optional field-level or item-level validation information.

    ErrorResponse:
      type: object
      description: Common error response.
      required: [code, message, details]
      additionalProperties: false
      properties:
        code:
          type: string
          description: Stable machine-readable error code.
        message:
          type: string
          description: Human-readable error message.
        details:
          type: array
          description: Optional validation details.
          items:
            $ref: '#/components/schemas/ErrorDetail'
